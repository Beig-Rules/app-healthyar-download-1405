<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سلامت‌یار | اپ سلامت فارسی</title>
<style>:root{--bg:#fff;--text:#111;--muted:#666;--accent:#000;--border:#e5e5e5;--card:#fafafa}[data-theme=dark]{--bg:#0a0a0a;--text:#f5f5f5;--muted:#aaa;--accent:#fff;--border:#2a2a2a;--card:#141414}*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui;background:var(--bg);color:var(--text)}.c{max-width:800px;margin:0 auto;padding:0 20px;text-align:center}.hero{padding:80px 0}h1{font-size:2.8rem;font-weight:800}.stores{display:flex;justify-content:center;gap:16px;margin:32px 0}.store{border:1px solid var(--border);padding:12px 24px;border-radius:8px;text-decoration:none;color:var(--text);font-weight:600}.features{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;text-align:right;margin:40px 0}.feat{background:var(--card);padding:20px;border-radius:8px;border:1px solid var(--border)}footer{padding:30px;color:var(--muted)}</style></head>
<body><header style="padding:16px;border-bottom:1px solid var(--border)"><div class="c" style="text-align:right"><strong>سلامت‌یار</strong></div></header>
<section class="hero c"><h1>سلامتی هوشمندانه
<br>در جیب شما</h1><p style="color:var(--muted);margin:16px 0">پیگیری تمرین، تغذیه و هدف‌های سلامت با هوش مصنوعی.</p>
<div class="stores"><a href="#" class="store">App Store</a><a href="#" class="store">Google Play</a></div></section>
<section class="c"><div class="features">
<div class="feat"><strong>پیگیری تمرین</strong><p>برنامه شخصی</p></div>
<div class="feat"><strong>تغذیه</strong><p>ردیابی کالری</p></div>
<div class="feat"><strong>هدف‌گذاری</strong><p>نمودار پیشرفت</p></div>
</div></section>
<footer>© ۱۴۰۵ سلامت‌یار — One-Page Studio</footer>
<script>if(matchMedia('(prefers-color-scheme:dark)').matches)document.documentElement.setAttribute('data-theme','dark')</script></body></html>
